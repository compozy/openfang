[package]
name = "openfang-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI tool for the OpenFang Agent OS"

[[bin]]
name = "openfang"
path = "src/main.rs"

[dependencies]
openfang-types = { workspace = true }
openfang-kernel = { workspace = true }
openfang-api = { workspace = true }
openfang-migrate = { workspace = true }
openfang-skills = { workspace = true }
openfang-extensions = { workspace = true }
zeroize = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
dirs = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
openfang-runtime = { workspace = true }
uuid = { workspace = true }
ratatui = { workspace = true }
colored = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
chrono = "0.4"
openfang-memory = { path = "../openfang-memory" }
pretty_assertions.workspace = true
